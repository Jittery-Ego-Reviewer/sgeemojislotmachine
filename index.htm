<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故事元素大冒險 (Story Adventure)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --arcade-bg: #1a0b2e;
            --neon-pink: #ff2a6d;
            --neon-cyan: #05d9e8;
            --neon-yellow: #ffb800;
        }

        body {
            font-family: 'DF-BiauKai', 'BiauKai', 'DFKai-SB', '標楷體', 'Microsoft JhengHei', sans-serif;
            background-color: var(--arcade-bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 42, 109, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(5, 217, 232, 0.15), transparent 25%);
            color: white;
            overflow-x: hidden;
            user-select: none;
        }

        /* Arcade Cabinet Styling */
        .arcade-cabinet {
            background: linear-gradient(135deg, #2a1b3d 0%, #1a0b2e 100%);
            border: 4px solid var(--neon-cyan);
            border-radius: 20px;
            box-shadow: 
                0 0 20px rgba(5, 217, 232, 0.5),
                inset 0 0 20px rgba(5, 217, 232, 0.2);
            position: relative;
        }

        .arcade-cabinet::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 4px solid var(--neon-pink);
            border-radius: 24px;
            z-index: -1;
            animation: pulse-border 2s infinite alternate;
        }

        /* Slot Styling */
        .slot-container {
            background: #0f0518;
            border: 3px solid #4a2b6d;
            border-radius: 15px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .slot-container:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--neon-yellow);
            box-shadow: 0 0 15px rgba(255, 184, 0, 0.5), inset 0 0 15px rgba(0,0,0,0.8);
        }

        .slot-container:active {
            transform: translateY(2px) scale(0.98);
        }

        .slot-emoji {
            font-size: 4rem;
            line-height: 1;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
            transition: transform 0.1s;
        }

        .spinning .slot-emoji {
            animation: spin-blur 0.1s infinite linear;
        }

        /* Text Gradients */
        .text-neon {
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        /* Animations */
        @keyframes pulse-border {
            0% { opacity: 0.5; box-shadow: 0 0 10px var(--neon-pink); }
            100% { opacity: 1; box-shadow: 0 0 30px var(--neon-pink); }
        }

        @keyframes spin-blur {
            0% { transform: translateY(-30px) scaleY(1.5); opacity: 0.5; }
            50% { transform: translateY(0) scaleY(1); opacity: 1; }
            100% { transform: translateY(30px) scaleY(1.5); opacity: 0.5; }
        }

        @keyframes pop-in {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop-in { animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Buttons */
        .btn-arcade {
            background: linear-gradient(180deg, var(--neon-pink) 0%, #cc0044 100%);
            border: 3px solid white;
            box-shadow: 0 6px 0 #880022, 0 0 15px var(--neon-pink);
            transition: all 0.1s;
        }
        .btn-arcade:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #880022, 0 0 5px var(--neon-pink);
        }

        .btn-arcade-blue {
            background: linear-gradient(180deg, var(--neon-cyan) 0%, #0099aa 100%);
            border: 3px solid white;
            box-shadow: 0 6px 0 #005566, 0 0 15px var(--neon-cyan);
            transition: all 0.1s;
        }
        .btn-arcade-blue:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #005566, 0 0 5px var(--neon-cyan);
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Canvas for Confetti -->
    <canvas id="confetti-canvas" class="hidden"></canvas>

    <!-- START SCREEN -->
    <div id="start-screen" class="max-w-3xl w-full text-center arcade-cabinet p-8 md:p-12 pop-in">
        <h1 class="text-5xl md:text-7xl font-bold mb-4 text-neon tracking-wider">故事元素大冒險</h1>
        <p class="text-xl md:text-2xl text-cyan-200 mb-8 font-bold">言語治療小遊戲</p>
        
        <div class="bg-black bg-opacity-40 rounded-xl p-6 mb-8 text-left border border-purple-500 shadow-inner">
            <h2 class="text-2xl text-yellow-300 mb-4 flex items-center"><span class="text-3xl mr-2">🎮</span> 遊戲玩法：</h2>
            <ul class="space-y-3 text-lg text-gray-100">
                <li class="flex items-start"><span class="text-pink-400 mr-2">1.</span> 學生開始講述一個的故事。</li>
                <li class="flex items-start"><span class="text-pink-400 mr-2">2.</span> 當學生成功講出一個「故事元素」（如：時間、地點）時，治療師點擊對應的老虎機按鈕。</li>
                <li class="flex items-start"><span class="text-pink-400 mr-2">3.</span> 便可轉出一個隨機的 Emoji。</li>
                <li class="flex items-start"><span class="text-pink-400 mr-2">4.</span> 學生需要嘗試將這個Emoji加入並豐富正在講述的故事中！</li>
                <li class="flex items-start"><span class="text-pink-400 mr-2">5.</span> 集齊所有故事元素，完成終極大冒險！</li>
            </ul>
        </div>

        <button onclick="startGame()" class="btn-arcade text-3xl text-white font-bold py-4 px-12 rounded-full uppercase tracking-widest">
            開始遊戲 START
        </button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="max-w-6xl w-full hidden">
        <div class="flex justify-between items-center mb-6 px-4">
            <h2 class="text-3xl md:text-4xl font-bold text-neon">故事元素大冒險</h2>
            <div class="bg-black bg-opacity-60 border-2 border-cyan-400 rounded-full px-6 py-2 flex items-center shadow-[0_0_10px_#05d9e8]">
                <span class="text-xl mr-3 text-cyan-200">收集進度:</span>
                <div class="text-3xl font-bold text-yellow-300">
                    <span id="score-display">0</span> / 8
                </div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-gray-800 rounded-full h-4 mb-8 border border-gray-600 overflow-hidden">
            <div id="progress-bar" class="bg-gradient-to-r from-cyan-400 to-pink-500 h-4 rounded-full transition-all duration-500 w-0 shadow-[0_0_10px_#ff2a6d]"></div>
        </div>

        <!-- Slot Machine Grid -->
        <div class="arcade-cabinet p-6 md:p-8">
            <div id="slots-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                <!-- Slots will be generated by JS -->
            </div>
            
            <div class="mt-8 text-center hidden" id="finish-btn-container">
                <button onclick="endGame()" class="btn-arcade text-2xl text-white font-bold py-3 px-10 rounded-full pop-in">
                    🎉 你説了一個完整的故事！查看結果 🎉
                </button>
            </div>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="max-w-5xl w-full hidden text-center arcade-cabinet p-8 md:p-12">
        <h1 class="text-5xl md:text-6xl font-bold mb-2 text-neon">大成功！</h1>
        <p class="text-2xl text-yellow-300 mb-8">你創作了一個有趣、完整故事！</p>
        
        <div class="bg-black bg-opacity-50 border-2 border-purple-500 rounded-2xl p-6 mb-8">
            <h3 class="text-xl text-cyan-300 mb-4 border-b border-purple-500 pb-2">故事元素回顧：</h3>
            <div id="summary-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 text-left">
                <!-- Summary items generated by JS -->
            </div>
        </div>

        <button onclick="resetGame()" class="btn-arcade-blue text-2xl text-white font-bold py-4 px-10 rounded-full">
            🔄 再玩一次 PLAY AGAIN
        </button>
    </div>

    <script>
        // --- DATA ---
        const storyGrammarElements = [
            { id: 'time', label: '時間', icon: '🕒', color: '#FF5733' },
            { id: 'place', label: '地點', icon: '📍', color: '#33FF57' },
            { id: 'character', label: '人物', icon: '👤', color: '#3357FF' },
            { id: 'initiating', label: '起因', icon: '❔', color: '#F1C40F' },
            { id: 'reaction', label: '反應', icon: '😦', color: '#9B59B6' },
            { id: 'plan', label: '計劃', icon: '💡', color: '#E67E22' },
            { id: 'action', label: '行動', icon: '🏃', color: '#1ABC9C' },
            { id: 'consequence', label: '結果+感受', icon: '🎉', color: '#E74C3C' }
        ];

        // A large list of fun, recognizable emojis for children
        const emojis = [
            '🐶','🐱','🐭','🌼','🚲','🛸','🛟','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🐤','🦆','🦅','🦉','🦇','🐺','🐴','🦄','🐝','🐛','🦋','🐌','🐞','🐜','🐢','🐍','🦖','🦕','🐙','🦑','🦐','🦀','🐡','🐠','🐟','🐬','🐳','🦈','🐊','🐅','🦓','🦍','🐘','🦛','🦏','🐪','🦒','🦘','🐎','🐖','🐑','🦙','🐐','🦌','🐕','🐈','🦚','🦜','🦢','🦩','🐇','🦝','🦨','🦥','🐁','🐿','🦔','🐾','🐉','🐲','🌵','🎄','🌲','🌳','🌴','🌱','🌿','☘','🍀','🍃','🍂','🍁','🍄','💐','🌷','🌹','🌺','🌸','🌼','🌻','🌞','🌝','🌛','🌙','🌎','🪐','⭐','🌟','✨','⚡','☄','💥','🔥','🌪','🌈','☀️','☁','🌦','🌧','⛈','🌨','❄','⛄','🌬','💧','💦','☔','🌊','🍏','🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🍈','🍒','🍑','🥭','🍍','🥥','🥝','🍅','🍆','🥑','🥦','🥒','🌶','🌽','🥕','🥔','🍠','🥐','🥯','🍞','🥖','🥨','🧀','🥚','🍳','🥞','🧇','🥓','🥩','🍗','🍖','🦴','🌭','🍔','🍟','🍕','🥪','🌮','🌯','🥗','🥘','🍝','🍜','🍲','🍛','🍣','🍱','🥟','🍤','🍙','🍚','🍘','🍥','🥮','🍢','🍡','🍧','🍨','🍦','🥧','🧁','🍰','🎂','🍮','🍭','🍬','🍫','🍿','🍩','🍪','🌰','🥜','🍯','🥛','🍼','☕','🍵','🧃','🥤','🧊'
        ];

        // --- STATE ---
        let state = {
            progress: 0,
            slotsData: {}, // { id: { emoji: '🐶', isLocked: true } }
            isSpinning: false
        };

        // --- AUDIO SYSTEM (Web Audio API for arcade sounds without external files) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(frequency, type, duration, vol = 0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            
            // Envelope to prevent clicking
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function playClickSound() {
            playTone(800, 'square', 0.1, 0.05);
        }

        function playSpinSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playSuccessSound() {
            playTone(523.25, 'sine', 0.15, 0.1); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.15, 0.1), 100); // E5
            setTimeout(() => playTone(783.99, 'sine', 0.3, 0.1), 200); // G5
        }

        function playWinGameSound() {
            const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51]; // A major arpeggio
            notes.forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'square', 0.2, 0.1), i * 100);
            });
        }

        // --- DOM ELEMENTS ---
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        const slotsGrid = document.getElementById('slots-grid');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const finishBtnContainer = document.getElementById('finish-btn-container');
        const summaryGrid = document.getElementById('summary-grid');

        // --- INITIALIZATION ---
        function initSlots() {
            slotsGrid.innerHTML = '';
            storyGrammarElements.forEach(element => {
                // Initialize state
                state.slotsData[element.id] = { emoji: null, isLocked: false };

                // Create DOM
                const slotDiv = document.createElement('div');
                slotDiv.className = 'slot-container flex flex-col items-center justify-center p-4 h-48 md:h-56 group';
                slotDiv.id = `slot-${element.id}`;
                slotDiv.onclick = () => handleSlotClick(element.id);

                slotDiv.innerHTML = `
                    <div class="text-gray-400 mb-2 font-bold text-lg md:text-xl tracking-widest flex items-center gap-2 z-10">
                        <span class="text-2xl">${element.icon}</span> 
                        <span style="color: ${element.color}">${element.label}</span>
                    </div>
                    <div class="slot-bg absolute inset-0 opacity-10 transition-opacity group-hover:opacity-20" style="background-color: ${element.color}"></div>
                    <div class="slot-emoji-container flex-1 flex items-center justify-center relative w-full h-full">
                        <div id="emoji-${element.id}" class="slot-emoji text-gray-600 opacity-50 text-5xl md:text-6xl">❓</div>
                    </div>
                    <div class="mt-2 text-xs text-gray-500 font-bold tracking-widest uppercase click-hint group-hover:text-yellow-400 transition-colors">
                        點擊抽圖案 (TAP)
                    </div>
                `;
                slotsGrid.appendChild(slotDiv);
            });
        }

        // --- CORE LOGIC ---
        function startGame() {
            playClickSound();
            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('pop-in');
            initSlots();
            updateProgressDisplay();
        }

        function getRandomEmoji() {
            return emojis[Math.floor(Math.random() * emojis.length)];
        }

        function handleSlotClick(id) {
            if (state.isSpinning) return; // Prevent clicking while another is spinning
            
            const slotData = state.slotsData[id];
            const slotEl = document.getElementById(`slot-${id}`);
            const emojiEl = document.getElementById(`emoji-${id}`);
            
            state.isSpinning = true;
            playSpinSound();
            
            slotEl.classList.add('spinning');
            emojiEl.classList.remove('text-gray-600', 'opacity-50');
            emojiEl.classList.add('text-white');

            // Visual spin effect
            let spinCount = 0;
            const spinInterval = setInterval(() => {
                emojiEl.textContent = getRandomEmoji();
                spinCount++;
                
                if (spinCount > 15) { // Stop after 15 changes (~750ms)
                    clearInterval(spinInterval);
                    finalizeSpin(id, slotEl, emojiEl, slotData);
                }
            }, 50);
        }

        function finalizeSpin(id, slotEl, emojiEl, slotData) {
            slotEl.classList.remove('spinning');
            const finalEmoji = getRandomEmoji();
            emojiEl.textContent = finalEmoji;
            emojiEl.style.transform = 'scale(1.3)';
            setTimeout(() => emojiEl.style.transform = 'scale(1)', 200);

            // Play sound
            playSuccessSound();

            // Update state styling
            slotEl.classList.add('border-green-400');
            slotEl.classList.remove('border-[#4a2b6d]');
            slotEl.querySelector('.click-hint').textContent = '重新抽取 (RE-ROLL)';
            slotEl.querySelector('.click-hint').classList.remove('text-gray-500');
            slotEl.querySelector('.click-hint').classList.add('text-green-400');

            // Update progress if first time clicking this slot
            if (!slotData.isLocked) {
                slotData.isLocked = true;
                state.progress++;
                updateProgressDisplay();
            }
            
            slotData.emoji = finalEmoji; // Store the final emoji for the summary
            state.isSpinning = false;
        }

        function updateProgressDisplay() {
            scoreDisplay.textContent = state.progress;
            const percentage = (state.progress / 8) * 100;
            progressBar.style.width = `${percentage}%`;

            if (state.progress === 8) {
                setTimeout(() => {
                    finishBtnContainer.classList.remove('hidden');
                    playWinGameSound();
                }, 1000);
            }
        }

        function endGame() {
            playClickSound();
            gameScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');
            endScreen.classList.add('pop-in');
            
            // Build summary
            summaryGrid.innerHTML = '';
            storyGrammarElements.forEach(element => {
                const finalEmoji = state.slotsData[element.id].emoji || '❓';
                const div = document.createElement('div');
                div.className = 'bg-gray-800 rounded-lg p-3 flex items-center shadow-md border border-gray-600';
                div.innerHTML = `
                    <div class="text-3xl mr-3">${finalEmoji}</div>
                    <div>
                        <div class="text-xs text-gray-400">${element.icon} ${element.label}</div>
                    </div>
                `;
                summaryGrid.appendChild(div);
            });

            startConfetti();
        }

        function resetGame() {
            playClickSound();
            state.progress = 0;
            state.slotsData = {};
            state.isSpinning = false;
            
            finishBtnContainer.classList.add('hidden');
            endScreen.classList.add('hidden');
            
            stopConfetti();
            startGame(); // goes back to game screen and re-inits
        }

        // --- CONFETTI SYSTEM (Simple Canvas implementation) ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 10 + 5;
                this.speedY = Math.random() * 3 + 2;
                this.speedX = Math.random() * 4 - 2;
                this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 10 - 5;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotationSpeed;
                if (this.y > canvas.height) {
                    this.y = -10;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                ctx.restore();
            }
        }

        function startConfetti() {
            canvas.classList.remove('hidden');
            confettiParticles = [];
            for (let i = 0; i < 150; i++) {
                confettiParticles.push(new Particle());
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confettiParticles.forEach(p => {
                p.update();
                p.draw();
            });
            confettiAnimationId = requestAnimationFrame(animateConfetti);
        }

        function stopConfetti() {
            canvas.classList.add('hidden');
            cancelAnimationFrame(confettiAnimationId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

    </script>
</body>
</html>
