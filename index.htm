<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故事元素貼紙機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            /* Adventure landscape background */
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 50%, #7cfc00 50%, #32cd32 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none; /* Prevent text selection during gameplay */
        }

        /* Wooden Board styling for the slot machine */
        .wooden-board {
            background-color: #d4a373;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 20px,
                rgba(0,0,0,0.05) 20px,
                rgba(0,0,0,0.05) 40px
            );
            border: 12px solid #8b5a2b;
            border-radius: 24px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3), inset 0 0 20px rgba(0,0,0,0.2);
            position: relative;
        }
        
        /* Screws for the wooden board */
        .screw {
            width: 16px;
            height: 16px;
            background-color: #a9a9a9;
            border-radius: 50%;
            position: absolute;
            box-shadow: inset 1px 1px 3px rgba(255,255,255,0.8), inset -1px -1px 3px rgba(0,0,0,0.5), 1px 1px 2px rgba(0,0,0,0.5);
        }
        .screw::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 2px;
            background-color: #696969;
            transform: translate(-50%, -50%) rotate(45deg);
        }

        /* Slot Card Styling */
        .slot-card {
            background-color: #faedcd;
            border: 6px solid #ccd5ae;
            border-radius: 16px;
            box-shadow: 0 8px 0 #b5c08a, 0 15px 20px rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        .slot-card:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 #b5c08a, 0 5px 10px rgba(0,0,0,0.2);
        }
        .slot-card.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        /* Sticker Styling for Emojis */
        .sticker-container {
            width: 100px;
            height: 100px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            border: 4px solid white;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.1), 0 6px 10px rgba(0,0,0,0.15);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden; /* For spin effect */
            position: relative;
        }

        .emoji-display {
            font-size: 3.5rem;
            filter: drop-shadow(0px 4px 2px rgba(0,0,0,0.2));
            position: absolute;
            transition: transform 0.1s;
        }

        /* Animations */
        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.2) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .animate-pop {
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px #ffb703; }
            50% { box-shadow: 0 0 30px #ffb703, 0 0 10px #ffb703 inset; }
        }

        .highlight-slot {
            animation: pulse-glow 1.5s infinite;
            border-color: #ffb703 !important;
        }

        /* Cloud Animations for background */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            animation: moveClouds linear infinite;
            z-index: -1;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        @keyframes moveClouds {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(100vw); }
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: flex;
        }

        /* Progress Bar */
        .progress-bar-container {
            width: 100%;
            background-color: rgba(255,255,255,0.5);
            border-radius: 999px;
            border: 4px solid white;
            height: 30px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            width: 0%;
            transition: width 0.5s ease-out;
            position: relative;
        }
        /* Striped effect */
        .progress-bar-fill::after {
            content: "";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background-image: linear-gradient(
                -45deg,
                rgba(255, 255, 255, 0.2) 25%,
                transparent 25%,
                transparent 50%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0.2) 75%,
                transparent 75%,
                transparent
            );
            background-size: 30px 30px;
            animation: moveStripes 1s linear infinite;
        }
        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 30px 0; }
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen relative">

    <!-- Decorative Clouds -->
    <div class="cloud" style="width: 100px; height: 30px; top: 10%; left: 10%; animation-duration: 35s;"></div>
    <div class="cloud" style="width: 150px; height: 45px; top: 20%; left: 60%; animation-duration: 45s;"></div>
    <div class="cloud" style="width: 80px; height: 25px; top: 15%; left: 80%; animation-duration: 25s;"></div>

    <canvas id="confetti-canvas"></canvas>

    <!-- START SCREEN -->
    <div id="start-screen" class="screen active flex-col items-center justify-center min-h-screen w-full p-4 z-10">
        <div class="bg-white/90 backdrop-blur-sm p-8 md:p-12 rounded-3xl shadow-2xl max-w-2xl text-center border-8 border-yellow-400">
            <h1 class="text-5xl md:text-6xl font-black text-blue-600 mb-6 drop-shadow-md tracking-wide">
                🧭 故事元素貼紙機 🗺️
            </h1>
            <div class="text-left bg-blue-50 p-6 rounded-2xl mb-8 border-4 border-blue-200 shadow-inner">
                <h2 class="text-2xl font-bold text-blue-800 mb-4">歡迎來到故事老虎機！</h2>
                <ul class="text-xl text-gray-700 space-y-3 font-medium leading-relaxed">
                    <li>🎯 <strong>目標：</strong>說出包含8個元素的完整故事。</li>
                    <li>🎰 <strong>玩法：</strong>當你說出一個故事元素，便可以點擊對應的格子。</li>
                    <li>✨ <strong>驚喜：</strong>格子會轉出一張隨機的「貼紙」！</li>
                    <li>🧩 <strong>挑戰：</strong>試著把抽到的貼紙加進你的故事裡，讓故事更有趣、豐富！</li>
                </ul>
            </div>
            <button id="btn-start" class="text-3xl bg-gradient-to-r from-green-400 to-green-600 hover:from-green-500 hover:to-green-700 text-white font-black py-4 px-12 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 border-4 border-white">
                🚀 開始
            </button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen flex-col items-center w-full max-w-6xl p-4 pt-8 z-10">
        <!-- Header & Progress -->
        <div class="w-full flex flex-col md:flex-row justify-between items-center mb-6 bg-white/80 p-4 rounded-2xl shadow-lg border-4 border-white backdrop-blur-sm">
            <h1 class="text-3xl md:text-4xl font-black text-blue-700 mb-4 md:mb-0 drop-shadow-sm">故事元素貼紙機</h1>
            <div class="w-full md:w-1/2 flex flex-col items-center">
                <div class="text-xl font-bold text-gray-700 mb-2">已收集元素: <span id="progress-text" class="text-3xl text-green-600 font-black">0 / 8</span></div>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>

        <!-- Slot Machine Board -->
        <div class="wooden-board w-full p-6 md:p-10">
            <!-- Screws -->
            <div class="screw" style="top: 15px; left: 15px;"></div>
            <div class="screw" style="top: 15px; right: 15px;"></div>
            <div class="screw" style="bottom: 15px; left: 15px;"></div>
            <div class="screw" style="bottom: 15px; right: 15px;"></div>

            <!-- Slots Grid -->
            <div id="slots-container" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-8">
                <!-- Slots will be generated here by JS -->
            </div>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="screen flex-col items-center justify-center min-h-screen w-full p-4 z-20 absolute top-0 left-0 bg-black/40 backdrop-blur-sm">
        <div class="bg-white p-8 md:p-12 rounded-3xl shadow-2xl max-w-4xl text-center border-8 border-yellow-400 transform transition-all scale-95 hover:scale-100">
            <h1 class="text-5xl md:text-6xl font-black text-yellow-500 mb-4 drop-shadow-md">🎉 非常好！ 🎉</h1>
            <p class="text-2xl text-gray-700 font-bold mb-8">你完成了一個超級精彩的完整故事！</p>
            
            <div class="bg-blue-50 rounded-2xl p-6 mb-8 border-4 border-blue-100 shadow-inner">
                <h3 class="text-xl font-bold text-blue-800 mb-6">你的故事元素貼紙：</h3>
                <!-- Increased gap to accommodate labels -->
                <div id="summary-stickers" class="flex flex-wrap justify-center gap-6">
                    <!-- Stickers recap generated by JS -->
                </div>
            </div>

            <button id="btn-restart" class="text-3xl bg-gradient-to-r from-blue-400 to-blue-600 hover:from-blue-500 hover:to-blue-700 text-white font-black py-4 px-12 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 border-4 border-white">
                🔄 再玩一次
            </button>
        </div>
    </div>

    <script>
        // --- 1. DATA & STATE ---
        const STORY_ELEMENTS = [
            { id: 'time', name: '時間', color: 'text-blue-600', bg: 'bg-blue-100', emojis: ['☀️', '🌧️', '❄️', '⏰', '🌙', '🌅', '🌈', '⛈️'] },
            { id: 'place', name: '地點', color: 'text-green-600', bg: 'bg-green-100', emojis: ['🏫', '🏞️', '🏰', '🏝️', '🏠', '🏥', '🏕️', '🎡'] },
            { id: 'character', name: '人物', color: 'text-purple-600', bg: 'bg-purple-100', emojis: ['👦', '👧', '🧙‍♂️', '🐶', '🐱', '🐉', '🦸‍♀️', '🤖', '👽', '👸', '👻', '🤡'] },
            { id: 'cause', name: '起因', color: 'text-red-600', bg: 'bg-red-100', emojis: ['💥', '🎁', '🌪️', '💌', '🛸', '🪄', '🌋', '🗝️', '🚨', '💣'] },
            { id: 'reaction', name: '反應', color: 'text-orange-500', bg: 'bg-orange-100', emojis: ['😲', '😨', '🤔', '🤩', '😠', '🥺', '😱', '🥶', '😡', '🤯'] },
            { id: 'plan', name: '計劃', color: 'text-indigo-600', bg: 'bg-indigo-100', emojis: ['💡', '💭', '🧭', '📖', '🔍', '📝', '🧠', '🎯', '🗺️'] },
            { id: 'action', name: '行動', color: 'text-teal-600', bg: 'bg-teal-100', emojis: ['🏃', '🏊', '🧗', '🚣', '🕵️', '🤺', '🛠️', '🗣️', '🦸', '🚶'] },
            { id: 'result', name: '結果+感受', color: 'text-pink-600', bg: 'bg-pink-100', emojis: ['🎉', '🏆', '😭', '🥰', '🥳', '💀', '🩹', '🤝', '💖', '🥇'] }
        ];

        let state = {
            progress: 0,
            slots: STORY_ELEMENTS.map(el => ({ ...el, locked: false, currentEmoji: '❓', isSpinning: false }))
        };

        // --- 2. AUDIO SYSTEM (Self-contained) ---
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            // Envelope to avoid clicking sounds
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playClickSound() { playTone(800, 'sine', 0.1, 0.05); }
        function playSpinTick() { playTone(1200, 'triangle', 0.05, 0.02); }
        function playSuccessSound() {
            playTone(523.25, 'sine', 0.15, 0.1); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.15, 0.1), 100); // E5
            setTimeout(() => playTone(783.99, 'sine', 0.3, 0.1), 200); // G5
        }
        function playWinSound() {
            [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                setTimeout(() => playTone(freq, i%2===0 ? 'square':'triangle', 0.4, 0.1), i * 100);
            });
        }

        // --- 3. DOM ELEMENTS ---
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            end: document.getElementById('end-screen')
        };
        const slotsContainer = document.getElementById('slots-container');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progressBar');
        const progressBarFill = document.getElementById('progress-bar');
        const summaryStickers = document.getElementById('summary-stickers');

        // --- 4. GAME LOGIC & RENDERING ---
        
        function switchScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[screenName].classList.add('active');
        }

        function initGame() {
            initAudio();
            playClickSound();
            
            // Reset state
            state.progress = 0;
            state.slots = STORY_ELEMENTS.map(el => ({ ...el, locked: false, currentEmoji: '❓', isSpinning: false }));
            
            updateProgressUI();
            renderSlots();
            switchScreen('game');
            stopConfetti();
        }

        function updateProgressUI() {
            progressText.innerText = `${state.progress} / 8`;
            progressBarFill.style.width = `${(state.progress / 8) * 100}%`;
            
            if (state.progress === 8) {
                setTimeout(showEndScreen, 1500);
            }
        }

        function renderSlots() {
            slotsContainer.innerHTML = '';
            state.slots.forEach((slot, index) => {
                const card = document.createElement('div');
                card.className = `slot-card ${slot.locked ? 'bg-yellow-50 border-yellow-300' : ''}`;
                card.onclick = () => handleSlotClick(index);

                // Title
                const title = document.createElement('div');
                title.className = `text-2xl font-black ${slot.color} mb-2 bg-white px-4 py-1 rounded-full shadow-sm border-2 border-dashed border-gray-300`;
                title.innerText = slot.name;

                // Sticker Container
                const stickerBg = document.createElement('div');
                stickerBg.className = `sticker-container ${slot.bg} ${slot.locked ? 'highlight-slot' : ''}`;
                stickerBg.id = `sticker-${index}`;

                const emojiSpan = document.createElement('span');
                emojiSpan.className = 'emoji-display';
                emojiSpan.id = `emoji-${index}`;
                emojiSpan.innerText = slot.currentEmoji;
                
                // Add specific styling if locked
                if (slot.locked) {
                    stickerBg.style.transform = `rotate(${Math.random() * 10 - 5}deg)`;
                    stickerBg.classList.remove('highlight-slot'); // remove pulse after lock
                }

                stickerBg.appendChild(emojiSpan);
                card.appendChild(title);
                card.appendChild(stickerBg);
                slotsContainer.appendChild(card);
            });
        }

        function handleSlotClick(index) {
            initAudio();
            const slot = state.slots[index];
            
            if (slot.isSpinning) return; // Prevent double click while spinning
            
            slot.isSpinning = true;
            
            // If it's the first time being locked in, increase progress
            const isFirstTime = !slot.locked;
            
            // Visuals for spinning
            const stickerContainer = document.getElementById(`sticker-${index}`);
            const emojiDisplay = document.getElementById(`emoji-${index}`);
            stickerContainer.classList.remove('animate-pop');
            stickerContainer.style.transform = 'rotate(0deg)';
            
            let ticks = 0;
            const maxTicks = 20; // 2 seconds at 100ms
            
            const spinInterval = setInterval(() => {
                // Pick random emoji during spin
                const randomEmoji = slot.emojis[Math.floor(Math.random() * slot.emojis.length)];
                emojiDisplay.innerText = randomEmoji;
                // Move it up and down slightly for blur effect
                emojiDisplay.style.transform = `translateY(${Math.random() * 10 - 5}px)`;
                
                if (ticks % 2 === 0) playSpinTick();
                ticks++;

                if (ticks >= maxTicks) {
                    clearInterval(spinInterval);
                    finishSpin(index, isFirstTime);
                }
            }, 80);
        }

        function finishSpin(index, wasFirstTime) {
            const slot = state.slots[index];
            const stickerContainer = document.getElementById(`sticker-${index}`);
            const emojiDisplay = document.getElementById(`emoji-${index}`);
            
            // Pick final emoji
            const finalEmoji = slot.emojis[Math.floor(Math.random() * slot.emojis.length)];
            slot.currentEmoji = finalEmoji;
            slot.locked = true;
            slot.isSpinning = false;
            
            // Update UI
            emojiDisplay.innerText = finalEmoji;
            emojiDisplay.style.transform = 'translateY(0px)';
            
            // Animation and Sound
            playSuccessSound();
            stickerContainer.classList.add('animate-pop');
            
            // Random rotation for sticker look
            const rot = Math.random() * 14 - 7;
            setTimeout(() => {
                stickerContainer.style.transform = `rotate(${rot}deg)`;
                // Update parent style
                renderSlots(); // Re-render to update backgrounds
            }, 500);

            // Update Progress
            if (wasFirstTime) {
                state.progress++;
                updateProgressUI();
            }
        }

        function showEndScreen() {
            playWinSound();
            startConfetti();
            
            // Populate summary stickers with both emoji and label
            summaryStickers.innerHTML = '';
            state.slots.forEach(slot => {
                // Wrapper to hold sticker and label vertically
                const elementWrapper = document.createElement('div');
                elementWrapper.className = 'flex flex-col items-center gap-3 w-24';

                // The Sticker
                const sticker = document.createElement('div');
                sticker.className = `w-20 h-20 bg-white rounded-full flex items-center justify-center text-4xl shadow-md border-4 border-gray-200 transform hover:scale-110 transition`;
                sticker.innerText = slot.currentEmoji;
                sticker.style.transform = `rotate(${Math.random() * 20 - 10}deg)`;
                
                // The Name Label
                const label = document.createElement('div');
                label.className = `text-sm font-bold px-3 py-1 rounded-full shadow-sm border border-dashed border-gray-300 text-center w-full whitespace-nowrap ${slot.bg} ${slot.color}`;
                label.innerText = slot.name;

                elementWrapper.appendChild(sticker);
                elementWrapper.appendChild(label);
                summaryStickers.appendChild(elementWrapper);
            });

            switchScreen('end');
        }

        // --- 5. CONFETTI SYSTEM ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startConfetti() {
            confettiParticles = [];
            const colors = ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd', '#f9bec7', '#ff99c8', '#fcf6bd', '#d0f4de', '#a9def9', '#e4c1f9'];
            
            for (let i = 0; i < 150; i++) {
                confettiParticles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 100,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -20 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let active = false;
            confettiParticles.forEach(p => {
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.2; // gravity
                p.x += p.dx;
                p.y += p.dy;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();

                if (p.y < canvas.height) active = true;
            });

            if (active) {
                confettiAnimationId = requestAnimationFrame(animateConfetti);
            }
        }

        function stopConfetti() {
            cancelAnimationFrame(confettiAnimationId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // --- 6. EVENT LISTENERS ---
        document.getElementById('btn-start').addEventListener('click', initGame);
        document.getElementById('btn-restart').addEventListener('click', initGame);

    </script>
</body>
</html>
